[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-memory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "spacy>=3.7",
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "gitpython>=3.1",
    "sentence-transformers>=2.7",
    "rank-bm25>=0.2",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "black>=24.4",
    "bandit>=1.7",
    "pre-commit>=3.7",
]

[project.scripts]
cortex = "cli.cortex:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "hooks*", "cli*", "dashboard*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "PIE", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
]

[tool.coverage.run]
source = ["core", "hooks", "cli"]
omit = ["tests/*"]
